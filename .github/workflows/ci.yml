name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci_test_pw
          POSTGRES_DB: quran_academy_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U ci_test -d quran_academy_test"
          --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci_test:ci_test_pw@localhost:5433/quran_academy_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prisma migrate deploy
      - run: bunx vitest run --config vitest.integration.config.ts

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    env:
      DATABASE_URL: postgresql://ci_test:ci_test_pw@localhost:5433/quran_academy_test
      SESSION_SECRET: ci-secret-min-32-chars-long-xxxxxxxx
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bunx playwright install --with-deps chromium
      - run: bunx bddgen && bunx playwright test --grep-invert @wip

  build:
    runs-on: ubuntu-latest
    needs: quality
    env:
      DATABASE_URL: postgresql://ci_test:ci_test_pw@localhost:5433/quran_academy_test
      SESSION_SECRET: ci-secret-min-32-chars-long-xxxxxxxx
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bun run build
